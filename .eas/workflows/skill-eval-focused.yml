# Focused skill routing and source checks. All model calls run on EAS.
name: skill-eval-focused

defaults:
  image: sdk-57
  tools:
    bun: '1.3.14'
    node: '22.20.0'

on:
  pull_request_labeled:
    labels: [eval-focused]
  workflow_dispatch:
    inputs:
      experiment:
        type: choice
        options: [catalog-value, catalog-change]
        default: catalog-value
        description: With/without Expo skills, or main versus candidate
      case_id:
        type: string
        default: signal
        description: Case ID, signal (four graded cases), pilot, or all in the selected split
      split:
        type: choice
        options: [development, validation, holdout]
        default: development
        description: Task-family split; holdout is only for final validation
      repetitions:
        type: number
        default: 3
        description: Attempts per case on each side; use 3 for a smoke sample

jobs:
  focused:
    runs_on: linux-medium
    environment: production
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    env:
      FOCUSED_EXPERIMENT: ${{ inputs.experiment || 'catalog-value' }}
      FOCUSED_CASE: ${{ inputs.case_id || 'signal' }}
      FOCUSED_SPLIT: ${{ inputs.split || 'development' }}
      FOCUSED_REPETITIONS: ${{ toJSON(inputs.repetitions || 3) }}
      SKILL_EVAL_REMOTE: '1'
      CI: '1'
    steps:
      - uses: eas/checkout
      - name: Run the selected focused experiment
        run: bash scripts/run-focused-evals.sh
      - name: Summarize completed evidence
        id: summary
        if: ${{ always() }}
        run: set-output summary "$(python3 scripts/ci.py focused-summary focused-skill-eval)"
      - name: Upload reports, manifests, traces and app artifacts
        if: ${{ always() }}
        uses: eas/upload_artifact
        with:
          type: other
          name: focused-skill-eval
          path: focused-skill-eval

  comment:
    after: [focused]
    if: ${{ github.event_name == 'pull_request' }}
    type: github-comment
    params:
      payload: |
        <!-- expo-focused-signal -->
        ## Expo focused skill experiment

        ${{ after.focused.outputs.summary }}

        Counts describe a small sample. Advice judgments are provisional; config and HTTP checks are executable. No native runtime validation.

        Download `focused-skill-eval` and open `report.html` for failed criteria, routing, model costs and raw evidence.

        [Reports](${{ workflow.url }})
